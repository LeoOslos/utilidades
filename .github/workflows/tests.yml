# Corre los tests en cada pull request (los de Dependabot incluidos) y en
# cada push a master, con la versión de Python y la zona horaria de producción.
name: tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest
      - run: python -m pytest -q
